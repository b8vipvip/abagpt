name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate release tag and workspace versions
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          RELEASE_VERSION="$VERSION" node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";

          const tag = process.env.RELEASE_TAG;
          const version = process.env.RELEASE_VERSION;
          assert.match(tag, /^v\d+\.\d+\.\d+$/, "Only stable vX.Y.Z tags may publish");
          for (const file of [
            "package.json",
            "apps/server/package.json",
            "apps/web/package.json",
            "packages/protocol/package.json",
          ]) {
            const pkg = JSON.parse(readFileSync(file, "utf8"));
            assert.equal(pkg.version, version, file + " must match " + tag);
          }
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          for (const [key, file] of [
            ["", "package.json"],
            ["apps/server", "apps/server/package.json"],
            ["apps/web", "apps/web/package.json"],
            ["packages/protocol", "packages/protocol/package.json"],
          ]) {
            const pkg = JSON.parse(readFileSync(file, "utf8"));
            assert.equal(lock.packages[key]?.version, pkg.version, "package-lock mismatch: " + key);
          }
          assert.equal(execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(), process.env.GITHUB_SHA);
          console.log("Validated " + tag + " at " + process.env.GITHUB_SHA);
          NODE
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - name: Enforce 100% coverage across all measures
        run: npm run coverage
      - run: npm run build
      - name: Verify isolated backup and restore in both key modes
        run: npm run storage:drill
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run manifest -- --check

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve lowercase GHCR image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          build-args: |
            MIRROR_VERSION=${{ steps.version.outputs.version }}
            MIRROR_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Attest published image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify the immutable published image
        id: verify-image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          IMAGE_REF="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker pull --platform linux/amd64 "$IMAGE_REF"
          docker run --rm --platform linux/amd64 --network none --entrypoint node "$IMAGE_REF" scripts/restore-drill.mjs
          docker run --rm --platform linux/amd64 --network none \
            -e EXPECTED_VERSION -e EXPECTED_REVISION --entrypoint node "$IMAGE_REF" \
            -e 'const assert = require("node:assert/strict"); assert.equal(process.env.MIRROR_VERSION, process.env.EXPECTED_VERSION); assert.equal(process.env.MIRROR_BUILD_REVISION, process.env.EXPECTED_REVISION);'
          echo "node_version=$(docker run --rm --platform linux/amd64 --network none --entrypoint node "$IMAGE_REF" --version)" >> "$GITHUB_OUTPUT"

      - name: Assemble versioned release assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          CONTAINER_NODE_VERSION: ${{ steps.verify-image.outputs.node_version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: npm run release:assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/SHA256-MANIFEST.json
            release-assets/package-lock.json
            release-assets/openapi.json
            release-assets/openapi.yaml
            release-assets/README.md
            release-assets/CHANGELOG.md
            release-assets/RELEASE-RECOVERY.md
            release-assets/compose.yaml
            release-assets/Dockerfile
            release-assets/release-metadata.json
